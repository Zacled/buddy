<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="popup.css" />
  <title>Wheel Picker</title>
</head>
<body>
  <header>
    <h1>Wheel Picker</h1>
    <label class="switch" title="Enable / disable">
      <input type="checkbox" id="enabled" /><span class="slider"></span>
    </label>
  </header>
  <p class="sub">On <strong>wheelofnames.com</strong>, just press a number key:</p>

  <div class="keys">
    <div><span class="k">1</span>–<span class="k">9</span> &nbsp;that position wins (1 = first name)</div>
    <div><span class="k">0</span> or <span class="k">Esc</span> &nbsp;fair spin</div>
  </div>

  <div id="status" class="status status--idle">Open wheelofnames.com to begin.</div>

  <details class="adv">
    <summary>Advanced</summary>
    <label class="field">
      <span class="field-label">Aim offset (only change if a spin lands one name off)</span>
      <input type="number" id="delta" min="0.05" max="0.95" step="0.005" />
    </label>
    <button id="resetDelta" class="link">reset to 0.363</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
