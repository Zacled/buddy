<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wheel of Names | Random name picker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233369E8'/%3E%3Cpath d='M16 16 L31 16 A15 15 0 0 0 16 1 Z' fill='%23D50F25'/%3E%3Cpath d='M16 16 L16 1 A15 15 0 0 0 1 16 Z' fill='%23EEB211'/%3E%3Cpath d='M16 16 L1 16 A15 15 0 0 0 16 31 Z' fill='%23009925'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    background: radial-gradient(circle at 30% 20%, #1b2a4a 0%, #141a2e 40%, #2a1320 100%);
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 22px; font-size: 22px; font-weight: 700;
  }
  header .logo {
    width: 30px; height: 30px; border-radius: 50%;
    background: conic-gradient(#D50F25 0 90deg, #EEB211 90deg 180deg, #009925 180deg 270deg, #3369E8 270deg 360deg);
    box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 5px rgba(0,0,0,.15);
    cursor: pointer;
  }
  header .menu { margin-left: auto; display: flex; gap: 22px; opacity: .9; font-size: 15px; font-weight: 600; }
  header .menu span { cursor: default; }
  main {
    display: flex; gap: 24px; align-items: center;
    padding: 0 28px; height: calc(100% - 116px);
  }
  .wheel-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; position: relative; height: 100%; }
  #wheel { max-width: 78vmin; max-height: 78vmin; cursor: pointer; }
  .panel {
    width: 340px; flex: 0 0 340px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
    padding: 16px; height: 78vmin; display: flex; flex-direction: column;
    backdrop-filter: blur(4px);
  }
  .panel .tab {
    display: inline-flex; align-items: center; gap: 8px;
    background: #3369E8; color: #fff; font-weight: 700; padding: 7px 16px;
    border-radius: 999px; font-size: 15px; align-self: flex-start;
  }
  .panel .tab .count { background: rgba(255,255,255,.25); border-radius: 999px; padding: 0 9px; font-size: 13px; }
  #names {
    flex: 1 1 auto; margin-top: 14px; resize: none; width: 100%;
    background: rgba(0,0,0,.18); color: #fff; border: 1px solid rgba(255,255,255,.12);
    border-radius: 10px; padding: 12px; font-size: 16px; line-height: 1.7; font-family: inherit;
  }
  #names:focus { outline: none; border-color: #3369E8; }
  .panel .hint { margin-top: 12px; font-size: 13px; opacity: .65; text-align: center; }
  footer { text-align: center; font-size: 13px; opacity: .55; padding: 10px; }

  /* mute button */
  .mute { position: fixed; right: 18px; bottom: 14px; cursor: pointer; opacity: .6; font-size: 22px; user-select: none; }
  .mute:hover { opacity: 1; }

  /* winner modal */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .modal .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .card {
    position: relative; width: min(560px, 86vw); border-radius: 8px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); background: #2b2b2b;
  }
  .card .head { background: #F6B40E; color: #1a1a1a; font-weight: 700; font-size: 24px; padding: 16px 22px; }
  .card .body { padding: 36px 22px 22px; }
  .card .name { font-size: 56px; font-weight: 700; text-align: center; word-break: break-word; }
  .card .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
  .card button {
    font: inherit; font-weight: 600; font-size: 15px; padding: 9px 18px; border-radius: 6px; cursor: pointer; border: none;
  }
  .card .close { background: transparent; color: #fff; }
  .card .remove { background: #3369E8; color: #fff; }

  /* secret rig panel */
  .rig { position: fixed; right: 16px; top: 64px; width: 280px; z-index: 60;
    background: #11161f; border: 1px solid #2b3550; border-radius: 12px; padding: 16px;
    box-shadow: 0 16px 50px rgba(0,0,0,.6); display: none; }
  .rig.show { display: block; }
  .rig h3 { margin: 0 0 4px; font-size: 15px; }
  .rig p { margin: 0 0 12px; font-size: 12px; opacity: .6; }
  .rig label { display: block; font-size: 12px; opacity: .75; margin: 10px 0 5px; }
  .rig input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #2b3550;
    background: #0b0f16; color: #fff; font: inherit; }
  .rig .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .rig .toggle { position: relative; width: 44px; height: 24px; }
  .rig .toggle input { opacity: 0; width: 0; height: 0; }
  .rig .slider { position: absolute; inset: 0; background: #2b3550; border-radius: 24px; cursor: pointer; transition: .15s; }
  .rig .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .rig input:checked + .slider { background: #16a34a; }
  .rig input:checked + .slider::before { transform: translateX(20px); }
  .rig .state { font-size: 12px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #0b0f16; border: 1px solid #2b3550; }
  .rig .x { position: absolute; right: 12px; top: 10px; cursor: pointer; opacity: .5; }
  .rig datalist { color: #000; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
</style>
</head>
<body>
  <header>
    <div class="logo" id="logo" title=""></div>
    <div>wheelofnames.com</div>
    <div class="menu"><span>Customize</span><span>New</span><span>Open</span><span>Save</span><span>Share</span></div>
  </header>

  <main>
    <div class="wheel-wrap">
      <canvas id="wheel" width="700" height="700"></canvas>
    </div>
    <aside class="panel">
      <div class="tab">Entries <span class="count" id="count">0</span></div>
      <textarea id="names" spellcheck="false" placeholder="Type one name per line…"></textarea>
      <div class="hint">Click the wheel to spin</div>
    </aside>
  </main>

  <footer>Click the wheel or press the spacebar to spin.</footer>
  <div class="mute" id="mute" title="Mute / unmute">🔊</div>

  <!-- Winner -->
  <div class="modal" id="winner">
    <div class="backdrop" id="winBackdrop"></div>
    <div class="card">
      <div class="head">We have a winner!</div>
      <div class="body">
        <div class="name" id="winnerName"></div>
        <div class="actions">
          <button class="close" id="winClose">Close</button>
          <button class="remove" id="winRemove">Remove</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Secret rig control -->
  <div class="rig" id="rig">
    <span class="x" id="rigClose">✕</span>
    <h3>🎯 Rig control</h3>
    <p>Only you can see this. (Toggle: Alt+Shift+R, or triple-click the logo.)</p>
    <label>Winner should always be</label>
    <input type="text" id="rigTarget" list="rigNames" placeholder="Type or pick a name…" autocomplete="off" />
    <datalist id="rigNames"></datalist>
    <div class="row">
      <span>Rig the wheel</span>
      <label class="toggle"><input type="checkbox" id="rigOn" /><span class="slider"></span></label>
    </div>
    <div class="state" id="rigState"></div>
  </div>

  <canvas id="confetti"></canvas>

<script>
(() => {
  "use strict";
  const TWO_PI = Math.PI * 2;
  const PALETTE = ['#3369E8', '#D50F25', '#EEB211', '#009925'];
  const DEFAULT_NAMES = ["Ali","Beatriz","Charles","Diya","Eric","Fatima","Gabriel","Hanna"];

  // ---------- state ----------
  const LS = {
    names: "wn_names", target: "wn_rig_target", on: "wn_rig_on", muted: "wn_muted",
  };
  let names = load(LS.names) ? JSON.parse(load(LS.names)) : DEFAULT_NAMES.slice();
  let rot = 0;                 // current wheel rotation (radians)
  let spinning = false;
  let muted = load(LS.muted) === "1";

  const rig = {
    on: load(LS.on) === "1",
    target: load(LS.target) || "",
  };
  // URL convenience: #win=Name  (also arms it)
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  const m = hash.match(/(?:^|&)win=([^&]+)/i);
  if (m) { rig.target = m[1]; rig.on = true; persistRig(); }

  function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
  function persistRig() { save(LS.on, rig.on ? "1" : "0"); save(LS.target, rig.target); }
  const norm = (s) => (s == null ? "" : String(s)).replace(/\s+/g, " ").trim().toLowerCase();

  // ---------- elements ----------
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const namesEl = document.getElementById("names");
  const countEl = document.getElementById("count");

  // ---------- canvas sizing (HiDPI) ----------
  function sizeCanvas() {
    const cssSize = Math.min(window.innerHeight * 0.78, window.innerWidth - 420, 760);
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = cssSize + "px";
    canvas.width = canvas.height = Math.round(cssSize * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cssW = cssSize;
    drawWheel();
  }
  let cssW = 700;

  // ---------- geometry / winner ----------
  function seg() { return TWO_PI / Math.max(1, names.length); }

  // Pointer sits at world angle 0 (right, 3 o'clock). Slice i spans local
  // [i*seg,(i+1)*seg]; after rotation by rot it sits at world angle local+rot.
  // The slice under the pointer:
  function winnerIndex(rotation) {
    const n = names.length; if (!n) return -1;
    const s = TWO_PI / n;
    let a = ((-rotation) % TWO_PI + TWO_PI) % TWO_PI;
    return Math.floor(a / s) % n;
  }
  // Rotation that centers slice t under the pointer.
  function rotationForIndex(t) {
    const s = seg();
    return ((-(t + 0.5) * s) % TWO_PI + TWO_PI) % TWO_PI;
  }

  function textColor(hex) {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
    const lum = (0.299*r + 0.587*g + 0.114*b) / 255;
    return lum > 0.6 ? "#1a1a1a" : "#ffffff";
  }

  // ---------- drawing ----------
  function drawWheel() {
    const w = cssW, cx = w/2, cy = w/2;
    const R = w * 0.46, hub = R * 0.2;
    ctx.clearRect(0, 0, w, w);
    const n = names.length;
    if (!n) { drawHub(cx, cy, hub); drawPointer(cx, cy, R); return; }
    const s = TWO_PI / n;

    // soft shadow under wheel
    ctx.save();
    ctx.beginPath(); ctx.arc(cx, cy+4, R+6, 0, TWO_PI);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.filter = "blur(6px)"; ctx.fill();
    ctx.restore();

    // slices
    for (let i = 0; i < n; i++) {
      const a0 = i*s + rot, a1 = (i+1)*s + rot;
      let color = PALETTE[i % PALETTE.length];
      if (n > 1 && i === n-1 && (i % PALETTE.length) === 0) color = PALETTE[1 % PALETTE.length];
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
      ctx.fillStyle = color; ctx.fill();
    }
    // text
    const fs = Math.max(12, Math.min(30, R * 0.9 / Math.max(6, n) + 8, s * R * 0.55));
    ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.font = `600 ${fs}px Quicksand, Arial, sans-serif`;
    for (let i = 0; i < n; i++) {
      const center = (i + 0.5) * s + rot;
      ctx.save();
      ctx.translate(cx, cy); ctx.rotate(center);
      ctx.fillStyle = textColor(PALETTE[i % PALETTE.length]);
      let label = names[i];
      const maxChars = Math.max(6, Math.floor((R - hub) / (fs * 0.6)));
      if (label.length > maxChars) label = label.slice(0, maxChars - 1) + "…";
      ctx.fillText(label, R - 14, 0);
      ctx.restore();
    }
    drawHub(cx, cy, hub);
    drawPointer(cx, cy, R);
  }

  function drawHub(cx, cy, hub) {
    ctx.beginPath(); ctx.arc(cx, cy, hub, 0, TWO_PI);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "rgba(0,0,0,.12)"; ctx.stroke();
  }

  function drawPointer(cx, cy, R) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.shadowColor = "rgba(0,0,0,.4)"; ctx.shadowBlur = 8; ctx.shadowOffsetX = -2;
    ctx.beginPath();
    ctx.moveTo(R - 18, 0);
    ctx.lineTo(R + 26, -17);
    ctx.lineTo(R + 26, 17);
    ctx.closePath();
    ctx.fillStyle = "#E8B007"; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = "#C8102E"; ctx.stroke();
    ctx.restore();
  }

  // ---------- spin ----------
  function chooseTargetIndex() {
    if (rig.on && rig.target) {
      const want = norm(rig.target);
      let exact = -1, partial = -1;
      names.forEach((nm, i) => {
        const t = norm(nm);
        if (t === want && exact < 0) exact = i;
        if (partial < 0 && t && want && t.indexOf(want) !== -1) partial = i;
      });
      const idx = exact >= 0 ? exact : partial;
      if (idx >= 0) return idx;
    }
    return Math.floor(Math.random() * names.length);
  }

  function spin() {
    if (spinning || names.length === 0) return;
    spinning = true;
    resumeAudio();
    const t = chooseTargetIndex();
    const startRot = ((rot % TWO_PI) + TWO_PI) % TWO_PI;
    const targetNorm = rotationForIndex(t);
    const turns = 6 + Math.floor(Math.random() * 3); // 6–8 full turns
    let delta = ((targetNorm - startRot) % TWO_PI + TWO_PI) % TWO_PI;
    delta += turns * TWO_PI;
    const finalRot = startRot + delta;
    const duration = 6200 + Math.random() * 1600;
    const t0 = performance.now();
    let lastSeg = winnerIndex(startRot);

    function frame(now) {
      const x = Math.min(1, (now - t0) / duration);
      const e = 1 - Math.pow(1 - x, 3); // easeOutCubic
      rot = startRot + delta * e;
      drawWheel();
      const curSeg = winnerIndex(rot);
      if (curSeg !== lastSeg) { tick(); lastSeg = curSeg; }
      if (x < 1) { requestAnimationFrame(frame); }
      else {
        rot = finalRot % TWO_PI; drawWheel();
        spinning = false;
        const w = winnerIndex(rot);
        showWinner(names[w]);
      }
    }
    requestAnimationFrame(frame);
  }

  // ---------- winner modal ----------
  const winnerModal = document.getElementById("winner");
  const winnerName = document.getElementById("winnerName");
  let lastWinner = null;
  function showWinner(name) {
    lastWinner = name;
    winnerName.textContent = name;
    winnerModal.classList.add("show");
    launchConfetti();
    ding();
  }
  function closeWinner() { winnerModal.classList.remove("show"); }
  document.getElementById("winClose").onclick = closeWinner;
  document.getElementById("winBackdrop").onclick = closeWinner;
  document.getElementById("winRemove").onclick = () => {
    if (lastWinner != null) {
      const i = names.findIndex((n) => n === lastWinner);
      if (i >= 0) { names.splice(i, 1); syncNamesUI(); }
    }
    closeWinner();
  };

  // ---------- names UI ----------
  function syncNamesUI() {
    namesEl.value = names.join("\n");
    countEl.textContent = names.length;
    save(LS.names, JSON.stringify(names));
    refreshRigNames();
    drawWheel();
  }
  namesEl.addEventListener("input", () => {
    names = namesEl.value.split("\n").map((s) => s.replace(/\s+$/,"")).filter((s) => s.trim().length);
    countEl.textContent = names.length;
    save(LS.names, JSON.stringify(names));
    refreshRigNames();
    drawWheel();
  });

  // ---------- audio (WebAudio, no files) ----------
  let actx = null;
  function resumeAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch {} }
  function tick() {
    if (muted || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = 900;
      g.gain.setValueAtTime(0.0001, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.05, actx.currentTime + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.05);
      o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + 0.06);
    } catch {}
  }
  function ding() {
    if (muted || !actx) return;
    try {
      [523.25, 659.25, 783.99].forEach((f, i) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = "triangle"; o.frequency.value = f;
        const s = actx.currentTime + i * 0.07;
        g.gain.setValueAtTime(0.0001, s);
        g.gain.exponentialRampToValueAtTime(0.18, s + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, s + 0.5);
        o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s + 0.55);
      });
    } catch {}
  }
  const muteEl = document.getElementById("mute");
  function renderMute() { muteEl.textContent = muted ? "🔇" : "🔊"; }
  muteEl.onclick = () => { muted = !muted; save(LS.muted, muted ? "1" : "0"); renderMute(); };

  // ---------- confetti ----------
  const cc = document.getElementById("confetti");
  const cctx = cc.getContext("2d");
  let confetti = [];
  function sizeConfetti() { cc.width = window.innerWidth; cc.height = window.innerHeight; }
  function launchConfetti() {
    sizeConfetti();
    const colors = ['#3369E8','#D50F25','#EEB211','#009925','#ffffff','#ff7ac4'];
    for (let i = 0; i < 160; i++) {
      confetti.push({
        x: cc.width/2 + (Math.random()-0.5)*200,
        y: cc.height/2,
        vx: (Math.random()-0.5)*14,
        vy: -Math.random()*16 - 4,
        s: 4 + Math.random()*7,
        c: colors[(Math.random()*colors.length)|0],
        rot: Math.random()*TWO_PI, vr: (Math.random()-0.5)*0.4, life: 0,
      });
    }
    if (!confettiRunning) { confettiRunning = true; requestAnimationFrame(confettiFrame); }
  }
  let confettiRunning = false;
  function confettiFrame() {
    cctx.clearRect(0, 0, cc.width, cc.height);
    confetti.forEach((p) => {
      p.vy += 0.45; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life++;
      cctx.save(); cctx.translate(p.x, p.y); cctx.rotate(p.rot);
      cctx.fillStyle = p.c; cctx.fillRect(-p.s/2, -p.s/2, p.s, p.s*0.6); cctx.restore();
    });
    confetti = confetti.filter((p) => p.y < cc.height + 40 && p.life < 260);
    if (confetti.length) requestAnimationFrame(confettiFrame);
    else { confettiRunning = false; cctx.clearRect(0,0,cc.width,cc.height); }
  }

  // ---------- secret rig panel ----------
  const rigPanel = document.getElementById("rig");
  const rigTarget = document.getElementById("rigTarget");
  const rigOn = document.getElementById("rigOn");
  const rigState = document.getElementById("rigState");
  const rigNames = document.getElementById("rigNames");
  function refreshRigNames() {
    rigNames.innerHTML = "";
    names.forEach((n) => { const o = document.createElement("option"); o.value = n; rigNames.appendChild(o); });
  }
  function renderRig() {
    rigTarget.value = rig.target;
    rigOn.checked = rig.on;
    const want = norm(rig.target);
    const onWheel = names.some((n) => norm(n) === want || (want && norm(n).indexOf(want) !== -1));
    if (!rig.on) rigState.textContent = "Off — spins are fair.";
    else if (!rig.target) rigState.textContent = "Armed, but no name chosen.";
    else if (onWheel) rigState.textContent = `Armed ✓ — will land on “${rig.target}”.`;
    else rigState.textContent = `“${rig.target}” isn't on the wheel — spins fairly until it is.`;
  }
  function toggleRig(force) {
    const show = force != null ? force : !rigPanel.classList.contains("show");
    rigPanel.classList.toggle("show", show);
    if (show) { refreshRigNames(); renderRig(); rigTarget.focus(); }
  }
  rigTarget.addEventListener("input", () => { rig.target = rigTarget.value; persistRig(); renderRig(); });
  rigOn.addEventListener("change", () => { rig.on = rigOn.checked; persistRig(); renderRig(); });
  document.getElementById("rigClose").onclick = () => toggleRig(false);

  // open via Alt+Shift+R
  window.addEventListener("keydown", (e) => {
    if (e.altKey && e.shiftKey && (e.key === "R" || e.key === "r")) { e.preventDefault(); toggleRig(); }
    if (e.code === "Space" && !spinning && document.activeElement !== namesEl && document.activeElement !== rigTarget) {
      e.preventDefault(); spin();
    }
  });
  // open via triple-click on the logo
  let logoClicks = 0, logoTimer = null;
  document.getElementById("logo").addEventListener("click", () => {
    logoClicks++; clearTimeout(logoTimer);
    logoTimer = setTimeout(() => { logoClicks = 0; }, 600);
    if (logoClicks >= 3) { logoClicks = 0; toggleRig(); }
  });

  // ---------- wire up ----------
  canvas.addEventListener("click", spin);
  window.addEventListener("resize", () => { sizeCanvas(); sizeConfetti(); });

  // init
  renderMute();
  syncNamesUI();
  sizeCanvas();
  sizeConfetti();
  renderRig();
})();
</script>
</body>
</html>
