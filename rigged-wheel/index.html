<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wheel of Names | Random name picker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233369E8'/%3E%3Cpath d='M16 16 L31 16 A15 15 0 0 0 16 1 Z' fill='%23D50F25'/%3E%3Cpath d='M16 16 L16 1 A15 15 0 0 0 1 16 Z' fill='%23EEB211'/%3E%3Cpath d='M16 16 L1 16 A15 15 0 0 0 16 31 Z' fill='%23009925'/%3E%3Ccircle cx='16' cy='16' r='4' fill='white'/%3E%3C/svg%3E" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Quicksand', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #fff; overflow: hidden;
    background:
      radial-gradient(70% 90% at 12% 8%, rgba(36,82,150,.85) 0%, rgba(18,34,60,0) 55%),
      radial-gradient(80% 100% at 100% 60%, rgba(95,20,34,.9) 0%, rgba(40,12,20,0) 55%),
      linear-gradient(120deg, #12203a 0%, #0c1018 45%, #0a0c12 62%, #1c0c14 100%);
  }
  /* header */
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px; height: 60px;
  }
  header .brand { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 700; }
  header .logo {
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    background: conic-gradient(#D50F25 0 90deg, #EEB211 90deg 180deg, #009925 180deg 270deg, #3369E8 270deg 360deg);
    box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 5px rgba(0,0,0,.12);
  }
  header nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  header nav a {
    display: flex; align-items: center; gap: 7px; color: #e9edf5; text-decoration: none;
    font-size: 15px; font-weight: 600; padding: 8px 12px; border-radius: 8px; cursor: default; white-space: nowrap;
  }
  header nav a:hover { background: rgba(255,255,255,.08); }
  header nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
  header .lang { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; background: rgba(255,255,255,.12); font-weight: 600; }
  @media (max-width: 1150px) { header nav .lbl { display: none; } }

  main { display: flex; height: calc(100% - 96px); padding: 0 14px; }
  .wheel-wrap { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; position: relative; min-width: 0; }
  #wheel { max-width: 100%; max-height: 100%; cursor: pointer; }
  .edit-btn { position: absolute; left: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; background: #3369E8; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.4); z-index: 2; }
  .edit-btn svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 2; }
  .edit-btn:hover { background: #2a59cf; }

  /* right column (controls float on the gradient, like the real site) */
  .side { width: 460px; flex: 0 0 460px; position: relative; padding: 8px 24px 8px 0; display: flex; flex-direction: column; }
  .collapse {
    position: absolute; left: -14px; top: 26px; width: 30px; height: 30px; border-radius: 50%;
    background: #3369E8; display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  .tabs { display: flex; gap: 30px; justify-content: center; align-items: center; height: 48px; font-size: 17px; }
  .tabs .tab { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #aeb6c4; cursor: pointer; padding-bottom: 6px; }
  .tabs .tab.active { color: #fff; border-bottom: 3px solid #3369E8; }
  .tabs .badge { background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; font-size: 13px; padding: 1px 9px; font-weight: 700; }
  .toolbar { display: flex; gap: 10px; margin: 8px 0 12px; }
  .toolbar button {
    display: flex; align-items: center; gap: 7px; background: #3369E8; color: #fff; border: none;
    font: inherit; font-weight: 600; font-size: 14px; padding: 9px 14px; border-radius: 8px; cursor: pointer;
  }
  .toolbar button:hover { background: #2a59cf; }
  .toolbar svg { width: 16px; height: 16px; stroke: #fff; fill: none; stroke-width: 2; }
  .adv { display: flex; align-items: center; gap: 8px; font-size: 15px; color: #cfd6e2; margin-bottom: 10px; }
  .adv input { width: 16px; height: 16px; }
  #names {
    flex: 1 1 auto; resize: none; width: 100%; min-height: 0;
    background: rgba(0,0,0,.16); color: #fff; border: 1px solid rgba(255,255,255,.18);
    border-radius: 6px; padding: 12px 14px; font-size: 17px; line-height: 1.65; font-family: inherit;
  }
  #names:focus { outline: none; border-color: #3369E8; }
  .addwheel { display: flex; align-items: center; gap: 8px; margin-top: 14px; position: relative; }
  .addwheel button { display: flex; align-items: center; gap: 8px; background: #3369E8; color: #fff; border: none; font: inherit; font-weight: 600; padding: 11px 18px; border-radius: 8px; cursor: pointer; }
  .addwheel .beta { position: absolute; top: -9px; left: 6px; background: #EEB211; color: #1a1a1a; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #aeb6c4; padding: 10px 18px; border-top: 1px solid rgba(255,255,255,.08); }
  .foot a { color: #5a9bff; text-decoration: none; }

  .mute { position: fixed; left: 18px; bottom: 14px; cursor: pointer; opacity: .55; font-size: 22px; user-select: none; }
  .mute:hover { opacity: 1; }

  /* winner modal */
  .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal.show { display: flex; }
  .modal .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); }
  .card { position: relative; width: min(640px, 88vw); border-radius: 6px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.55); background: #2b2b2b; }
  .card .head { background: #F6B40E; color: #1a1a1a; font-weight: 700; font-size: 26px; padding: 16px 24px; }
  .card .body { padding: 40px 24px 22px; }
  .card .name { font-size: 60px; font-weight: 700; text-align: center; word-break: break-word; }
  .card .actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 34px; }
  .card button { font: inherit; font-weight: 600; font-size: 15px; padding: 9px 20px; border-radius: 6px; cursor: pointer; border: none; }
  .card .close { background: transparent; color: #fff; }
  .card .remove { background: #3369E8; color: #fff; }

  /* secret rig panel */
  .rig { position: fixed; right: 16px; top: 70px; width: 290px; z-index: 60; background: #11161f; border: 1px solid #2b3550; border-radius: 12px; padding: 16px; box-shadow: 0 16px 50px rgba(0,0,0,.6); display: none; }
  .rig.show { display: block; }
  .rig h3 { margin: 0 0 4px; font-size: 15px; }
  .rig p { margin: 0 0 6px; font-size: 12px; opacity: .6; }
  .rig label { display: block; font-size: 12px; opacity: .75; margin: 12px 0 5px; }
  .rig input[type=text] { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #2b3550; background: #0b0f16; color: #fff; font: inherit; }
  .rig .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .rig .toggle { position: relative; width: 44px; height: 24px; }
  .rig .toggle input { opacity: 0; width: 0; height: 0; }
  .rig .slider { position: absolute; inset: 0; background: #2b3550; border-radius: 24px; cursor: pointer; transition: .15s; }
  .rig .slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .rig input:checked + .slider { background: #16a34a; }
  .rig input:checked + .slider::before { transform: translateX(20px); }
  .rig .state { font-size: 12px; margin-top: 12px; padding: 8px 10px; border-radius: 8px; background: #0b0f16; border: 1px solid #2b3550; }
  .rig .x { position: absolute; right: 12px; top: 10px; cursor: pointer; opacity: .5; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
</style>
</head>
<body>
  <header>
    <div class="brand"><div class="logo" id="logo"></div><span>wheelofnames.com</span></div>
    <nav>
      <a><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.2 0-1 .8-1.6 1.8-1.6H17a4 4 0 0 0 4-4c0-4.4-4-8.1-9-8.1z"/><circle cx="7.5" cy="12" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="7.8" r="1.1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="7.8" r="1.1" fill="currentColor" stroke="none"/></svg><span class="lbl">Customize</span></a>
      <a><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">New</span></a>
      <a><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Open</span></a>
      <a><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h7V3"/><rect x="8" y="13" width="8" height="5"/></svg><span class="lbl">Save</span></a>
      <a><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8 11l8-4M8 13l8 4"/></svg><span class="lbl">Share</span></a>

  <main>
    <div class="wheel-wrap">
      <div class="edit-btn" id="editBtn" title="Edit names"><svg viewBox="0 0 24 24"><path d="M4 20l4-1L18 9l-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg></div>

    <aside class="side">
      <div class="collapse" id="logo2">&#10095;</div>
      <div class="tabs">
        <div class="tab active">Entries <span class="badge" id="count">0</span></div>
        <div class="tab">Results <span class="badge">0</span></div>

      <div class="toolbar">
        <button id="shuffleBtn"><svg viewBox="0 0 24 24"><path d="M3 6h4l10 12h4"/><path d="M3 18h4l3-3.5"/><path d="M14 8l3-2 0 4"/><path d="M17 16l3 2-3 2"/></svg>Shuffle</button>
        <button id="sortBtn"><svg viewBox="0 0 24 24"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg>Sort</button>
        <button><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l5-4 4 3 3-3 6 5"/></svg>Add image <svg viewBox="0 0 24 24" style="width:14px"><path d="M6 9l6 6 6-6"/></svg></button>

    </aside>

  <div class="foot"><span>Version 413</span><a>Changelog</a></div>

  <div class="modal" id="winner">
    <div class="backdrop" id="winBackdrop"></div>

      <div class="head">We have a winner!</div>

        <div class="name" id="winnerName"></div>

  <div class="rig" id="rig">
    <span class="x" id="rigClose">✕</span>

    <input type="text" id="rigTarget" list="rigNames" placeholder="Type or pick a name…" autocomplete="off" />
    <datalist id="rigNames"></datalist>
    <div class="row"><span>Rig the wheel</span><label class="toggle"><input type="checkbox" id="rigOn" /><span class="slider"></span></label></div>
    <div class="state" id="rigState"></div>
  </div>

  <canvas id="confetti"></canvas>

<script>
(() => {
  "use strict";
  const TWO_PI = Math.PI * 2;
  const PALETTE = ['#3369E8', '#D50F25', '#EEB211', '#009925'];
  const DEFAULT_NAMES = ["Ali","Beatriz","Charles"];
  const LS = { names:"wn_names", target:"wn_rig_target", on:"wn_rig_on", muted:"wn_muted" };

  function load(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function save(k,v){ try { localStorage.setItem(k,v); } catch {} }
  const norm = (s) => (s==null?"":String(s)).replace(/\s+/g," ").trim().toLowerCase();

  let names = load(LS.names) ? JSON.parse(load(LS.names)) : DEFAULT_NAMES.slice();
  let rot = 0, spinning = false, hasSpun = false;
  let muted = load(LS.muted) === "1";
  const rig = { on: load(LS.on)==="1", target: load(LS.target)||"" };
  const hash = decodeURIComponent(location.hash.replace(/^#/,""));
  const hm = hash.match(/(?:^|&)win=([^&]+)/i);
  if (hm) { rig.target = hm[1]; rig.on = true; }
  function persistRig(){ save(LS.on, rig.on?"1":"0"); save(LS.target, rig.target); }

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const namesEl = document.getElementById("names");
  const countEl = document.getElementById("count");
  let cssW = 700;

  function sizeCanvas() {
    const cssSize = Math.max(260, Math.min(window.innerHeight*0.82, window.innerWidth-560, 720));
    const dpr = window.devicePixelRatio || 1;
    canvas.style.width = canvas.style.height = cssSize + "px";
    canvas.width = canvas.height = Math.round(cssSize*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cssW = cssSize; drawWheel();
  }

  function seg(){ return TWO_PI / Math.max(1, names.length); }
  function winnerIndex(rotation){
    const n = names.length; if (!n) return -1;
    const s = TWO_PI/n;
    let a = ((-rotation)%TWO_PI + TWO_PI)%TWO_PI;
    return Math.floor(a/s) % n;
  }
  function rotationForIndex(t){
    const s = seg();
    return ((-(t+0.5)*s)%TWO_PI + TWO_PI)%TWO_PI;
  }
  function textColor(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255 > 0.62 ? "#1a1a1a" : "#ffffff";
  }

  function drawWheel(){
    const w = cssW, cx = w/2, cy = w/2, R = w*0.46, hub = R*0.2;
    ctx.clearRect(0,0,w,w);
    const n = names.length;
    // shadow
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy+5, R+7, 0, TWO_PI);
    ctx.fillStyle="rgba(0,0,0,.4)"; ctx.filter="blur(7px)"; ctx.fill(); ctx.restore();
    if (n) {
      const s = TWO_PI/n;
      for (let i=0;i<n;i++){
        const a0=i*s+rot, a1=(i+1)*s+rot;
        let color = PALETTE[i % PALETTE.length];
        if (n>1 && i===n-1 && (i % PALETTE.length)===0) color = PALETTE[1];
        ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath();
        ctx.fillStyle=color; ctx.fill();
      }
      // subtle radial sheen
      ctx.save(); const g=ctx.createRadialGradient(cx,cy,hub,cx,cy,R);
      g.addColorStop(0,"rgba(255,255,255,.10)"); g.addColorStop(.5,"rgba(255,255,255,0)"); g.addColorStop(1,"rgba(0,0,0,.10)");
      ctx.beginPath(); ctx.arc(cx,cy,R,0,TWO_PI); ctx.fillStyle=g; ctx.fill(); ctx.restore();
      // labels
      const fs = Math.max(14, Math.min(R*0.17, s*R*0.42));
      ctx.textAlign="right"; ctx.textBaseline="middle";
      ctx.font = `600 ${fs}px Quicksand, Arial, sans-serif`;
      for (let i=0;i<n;i++){
        const center=(i+0.5)*s+rot;
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(center);
        ctx.fillStyle=textColor(PALETTE[i%PALETTE.length]);
        let label=names[i];
        const maxChars=Math.max(6, Math.floor((R-hub)/(fs*0.58)));
        if (label.length>maxChars) label=label.slice(0,maxChars-1)+"…";
        ctx.fillText(label, R-16, 0);
        ctx.restore();
      }
    }
    // hub
    ctx.beginPath(); ctx.arc(cx,cy,hub,0,TWO_PI); ctx.fillStyle="#fff"; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="rgba(0,0,0,.10)"; ctx.stroke();
    // pointer (blue, right side, pointing left)
    ctx.save(); ctx.translate(cx,cy);
    ctx.shadowColor="rgba(0,0,0,.45)"; ctx.shadowBlur=9; ctx.shadowOffsetX=-2;
    ctx.beginPath(); ctx.moveTo(R-20,0); ctx.lineTo(R+28,-18); ctx.lineTo(R+28,18); ctx.closePath();
    ctx.fillStyle="#3f74de"; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle="#2a55c0"; ctx.stroke(); ctx.restore();
    // idle prompt
    if (!spinning && !hasSpun && n) {
      drawArcText("Click to spin", cx, cy, R*0.72, -Math.PI/2, +1, +Math.PI/2, Math.round(R*0.135));
      drawArcText("or press ctrl+enter", cx, cy, R*0.72, +Math.PI/2, -1, -Math.PI/2, Math.round(R*0.088));
    }
  }

  function drawArcText(text, cx, cy, R, centerA, dir, rotOff, fontPx){
    ctx.save();
    ctx.font = `700 ${fontPx}px Quicksand, Arial, sans-serif`;
    ctx.fillStyle = "rgba(255,255,255,.92)";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.shadowColor="rgba(0,0,0,.5)"; ctx.shadowBlur=6;
    const chars=[...text];
    const widths=chars.map(c=>ctx.measureText(c).width);
    const totalAngle=widths.reduce((a,wd)=>a+wd,0)/R;
    let a = centerA - dir*totalAngle/2;
    for (let i=0;i<chars.length;i++){
      const wAng=widths[i]/R, mid=a+dir*wAng/2;
      ctx.save();
      ctx.translate(cx+Math.cos(mid)*R, cy+Math.sin(mid)*R);
      ctx.rotate(mid+rotOff);
      ctx.fillText(chars[i],0,0);
      ctx.restore();
      a += dir*wAng;
    }
    ctx.restore();
  }

  function chooseTargetIndex(){
    if (rig.on && rig.target){
      const want=norm(rig.target); let exact=-1,partial=-1;
      names.forEach((nm,i)=>{ const t=norm(nm); if(t===want&&exact<0)exact=i; if(partial<0&&t&&want&&t.indexOf(want)!==-1)partial=i; });
      const idx = exact>=0?exact:partial;
      if (idx>=0) return idx;
    }
    return Math.floor(Math.random()*names.length);
  }

  function spin(){
    if (spinning || names.length===0) return;
    spinning = true; hasSpun = true; resumeAudio();
    const t = chooseTargetIndex();
    const startRot = ((rot%TWO_PI)+TWO_PI)%TWO_PI;
    const turns = 7 + Math.floor(Math.random()*3);
    let delta = ((rotationForIndex(t)-startRot)%TWO_PI+TWO_PI)%TWO_PI + turns*TWO_PI;
    const finalRot = startRot+delta;
    const duration = 7400 + Math.random()*1800;
    const t0 = performance.now();
    let lastSeg = winnerIndex(startRot);
    // Authentic feel: brief acceleration, then a long exponential decay tail.
    const FA = 0.1, KK = 5, TOT = FA/2 + (1 - Math.exp(-KK*(1-FA)))/KK;
    const ease = (x) => (x < FA ? (x*x)/(2*FA) : FA/2 + (1 - Math.exp(-KK*(x-FA)))/KK) / TOT;
    function frame(now){
      const x = Math.min(1,(now-t0)/duration);
      rot = startRot + delta*ease(x);
      drawWheel();
      const cur=winnerIndex(rot);
      if (cur!==lastSeg){ tick(); lastSeg=cur; }
      if (x<1) requestAnimationFrame(frame);
      else { rot=finalRot%TWO_PI; drawWheel(); spinning=false; showWinner(names[winnerIndex(rot)]); }
    }
    requestAnimationFrame(frame);
  }

  // winner modal
  const winnerModal=document.getElementById("winner"), winnerName=document.getElementById("winnerName");
  let lastWinner=null;
  function showWinner(name){ lastWinner=name; winnerName.textContent=name; winnerModal.classList.add("show"); launchConfetti(); ding(); }
  function closeWinner(){ winnerModal.classList.remove("show"); drawWheel(); }
  document.getElementById("winClose").onclick=closeWinner;
  document.getElementById("winBackdrop").onclick=closeWinner;
  document.getElementById("winRemove").onclick=()=>{ if(lastWinner!=null){ const i=names.findIndex(n=>n===lastWinner); if(i>=0){ names.splice(i,1); syncNamesUI(); } } closeWinner(); };

  // names
  function syncNamesUI(){ namesEl.value=names.join("\n"); countEl.textContent=names.length; save(LS.names,JSON.stringify(names)); refreshRigNames(); drawWheel(); }
  namesEl.addEventListener("input",()=>{ names=namesEl.value.split("\n").map(s=>s.replace(/\s+$/,"")).filter(s=>s.trim().length); countEl.textContent=names.length; save(LS.names,JSON.stringify(names)); refreshRigNames(); drawWheel(); });
  document.getElementById("shuffleBtn").onclick=()=>{ for(let i=names.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [names[i],names[j]]=[names[j],names[i]]; } syncNamesUI(); };
  document.getElementById("sortBtn").onclick=()=>{ names.sort((a,b)=>a.localeCompare(b,'en',{numeric:true,sensitivity:'base'})); syncNamesUI(); };

  // audio
  let actx=null;
  function resumeAudio(){ try{ if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended")actx.resume(); }catch{} }
  function tick(){ if(muted||!actx)return; try{ const o=actx.createOscillator(),g=actx.createGain(); o.type="sine"; o.frequency.value=620; const n=actx.currentTime; g.gain.setValueAtTime(0.0001,n); g.gain.exponentialRampToValueAtTime(0.028,n+0.001); g.gain.exponentialRampToValueAtTime(0.0001,n+0.035); o.connect(g); g.connect(actx.destination); o.start(); o.stop(n+0.045);}catch{} }
  function ding(){ if(muted||!actx)return; try{ [523.25,659.25,783.99].forEach((f,i)=>{ const o=actx.createOscillator(),g=actx.createGain(); o.type="triangle"; o.frequency.value=f; const s=actx.currentTime+i*0.07; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.18,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.5); o.connect(g); g.connect(actx.destination); o.start(s); o.stop(s+0.55); }); }catch{} }
  const muteEl=document.getElementById("mute");
  function renderMute(){ muteEl.textContent=muted?"🔇":"🔊"; }
  muteEl.onclick=()=>{ muted=!muted; save(LS.muted,muted?"1":"0"); renderMute(); };

  // confetti
  const cc=document.getElementById("confetti"), cctx=cc.getContext("2d");
  let confetti=[], confettiRunning=false;
  function sizeConfetti(){ cc.width=window.innerWidth; cc.height=window.innerHeight; }
  function launchConfetti(){ sizeConfetti(); const cols=['#3369E8','#D50F25','#EEB211','#009925','#fff','#ff7ac4'];
    for(let i=0;i<170;i++){ confetti.push({x:cc.width/2+(Math.random()-0.5)*220,y:cc.height/2,vx:(Math.random()-0.5)*14,vy:-Math.random()*16-4,s:4+Math.random()*7,c:cols[(Math.random()*cols.length)|0],rot:Math.random()*TWO_PI,vr:(Math.random()-0.5)*0.4,life:0}); }
    if(!confettiRunning){ confettiRunning=true; requestAnimationFrame(confettiFrame); } }
  function confettiFrame(){ cctx.clearRect(0,0,cc.width,cc.height);
    confetti.forEach(p=>{ p.vy+=0.45; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life++; cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot); cctx.fillStyle=p.c; cctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6); cctx.restore(); });
    confetti=confetti.filter(p=>p.y<cc.height+40&&p.life<260);
    if(confetti.length) requestAnimationFrame(confettiFrame); else { confettiRunning=false; cctx.clearRect(0,0,cc.width,cc.height); } }

  // rig panel
  const rigPanel=document.getElementById("rig"), rigTarget=document.getElementById("rigTarget"), rigOn=document.getElementById("rigOn"), rigState=document.getElementById("rigState"), rigNames=document.getElementById("rigNames");
  function refreshRigNames(){ rigNames.innerHTML=""; names.forEach(n=>{ const o=document.createElement("option"); o.value=n; rigNames.appendChild(o); }); }
  function renderRig(){ rigTarget.value=rig.target; rigOn.checked=rig.on; const want=norm(rig.target);
    const onWheel=names.some(n=>norm(n)===want||(want&&norm(n).indexOf(want)!==-1));
    rigState.textContent = !rig.on ? "Off — spins are fair." : !rig.target ? "Armed, but no name chosen." : onWheel ? `Armed ✓ — will land on “${rig.target}”.` : `“${rig.target}” isn't on the wheel — fair until it is.`; }
  function toggleRig(force){ const show=force!=null?force:!rigPanel.classList.contains("show"); rigPanel.classList.toggle("show",show); if(show){ refreshRigNames(); renderRig(); rigTarget.focus(); } }
  rigTarget.addEventListener("input",()=>{ rig.target=rigTarget.value; persistRig(); renderRig(); });
  rigOn.addEventListener("change",()=>{ rig.on=rigOn.checked; persistRig(); renderRig(); });
  document.getElementById("rigClose").onclick=()=>toggleRig(false);

  window.addEventListener("keydown",(e)=>{
    if(e.altKey&&e.shiftKey&&(e.key==="R"||e.key==="r")){ e.preventDefault(); toggleRig(); }
    if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); spin(); }
  });
  let lc=0,lt=null;
  function logoTriple(){ lc++; clearTimeout(lt); lt=setTimeout(()=>lc=0,600); if(lc>=3){ lc=0; toggleRig(); } }
  document.getElementById("logo").addEventListener("click",logoTriple);
  document.getElementById("logo2").addEventListener("click",logoTriple);

  canvas.addEventListener("click",spin);
  window.addEventListener("resize",()=>{ sizeCanvas(); sizeConfetti(); });

  document.getElementById("editBtn").onclick = () => namesEl.focus();
  rot = rotationForIndex(0);
  renderMute(); persistRig(); syncNamesUI(); sizeCanvas(); sizeConfetti(); renderRig();
})();
</script>
</body>
</html>
